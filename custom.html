<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakázkový 3D tisk | Tomino-3D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; }
        header { background: linear-gradient(to right, #1e3a8a, #1e40af); color: white; padding: 50px 0; }
        .step { background: #1e1e1e; border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .form-control, .form-select { background-color: #2d2d2d; color: #ffffff; border: 1px solid #444; }
        .btn-success { background-color: #16a34a; border: none; }
        .alert-info { background-color: #1e293b; border: 1px solid #334155; color: #ffffff; }
        footer { background-color: #0a0a0a; color: #ffffff; }
    </style>
</head>
<body>
    <header class="text-center">
        <div class="container">
            <h1>Zakázkový 3D tisk</h1>
            <p class="lead">Pošli model a specifikace – nacením do 1–2 dnů</p>
        </div>
    </header>

    <div class="container my-5">
        <form action="https://formspree.io/f/xykjqdaz" method="POST">
            <div class="step">
                <h4>Model</h4>
                <div class="mb-3">
                    <label class="form-label fw-bold">Odkaz na model:</label>
                    <input type="url" class="form-control" name="model_odkaz" placeholder="https://makerworld.com/... nebo přímý .stl/.3mf" required>
                </div>
            </div>

            <div class="step">
                <h4>Specifikace</h4>
                <div class="mb-3">
                    <label class="form-label fw-bold">Počet kusů:</label>
                    <input type="number" class="form-control" name="pocet" min="1" value="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Materiál:</label>
                    <select class="form-select" id="materialSelect" name="material" required>
                        <option value="" disabled selected>Vyberte</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Barva:</label>
                    <select class="form-select" id="colorSelect" name="barva" required>
                        <option value="" disabled selected>Nejprve materiál</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Poznámky:</label>
                    <textarea class="form-control" name="poznamky" rows="3" placeholder="výplň, vrstvy, podpory..."></textarea>
                </div>
            </div>

            <div class="step">
                <h4>Kontakt</h4>
                <div class="mb-3">
                    <label class="form-label fw-bold">E-mail:</label>
                    <input type="email" class="form-control" name="_replyto" required placeholder="vas@email.cz">
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100">Odeslat</button>
        </form>

        <div class="alert alert-info mt-4">
            <strong>Po odeslání:</strong> Do 1–2 dnů odpověď s cenou a termínem.
        </div>
    </div>

    <footer class="text-center py-4">
        <p>© 2025 Tomino-3D | Tomino.records@gmail.com</p>
    </footer>

    <script>
        fetch('materials.json')
            .then(r => r.json())
            .then(data => {
                const matSel = document.getElementById('materialSelect');
                const colSel = document.getElementById('colorSelect');

                data.materials.forEach(m => {
                    let opt = document.createElement('option');
                    opt.value = m.type;
                    opt.textContent = m.type;
                    matSel.appendChild(opt);
                });

                matSel.addEventListener('change', () => {
                    let sel = data.materials.find(m => m.type === matSel.value);
                    colSel.innerHTML = '<option value="" disabled selected>Vyberte barvu</option>';

                    if (sel && sel.colors.length > 0) {
                        sel.colors.forEach(c => {
                            let opt = document.createElement('option');
                            opt.value = c;
                            opt.textContent = c;
                            colSel.appendChild(opt);
                        });
                    } else {
                        colSel.innerHTML += '<option value="neuvedeno">Neuvedeno (napište do poznámek)</option>';
                    }
                });
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
